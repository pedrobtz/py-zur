name: build

# Two profiles (roadmap, "CI profiles"):
#
# - quick: every pull request and every push to main. Every job needs
#   `profile`; jobs with no other condition are quick.
# - full: quick plus every job gated on `needs.profile.outputs.full`.
#   It runs on the `full-ci` label, the weekly schedule and dispatch.
#
# Adding or removing `full-ci` re-runs the workflow in the new profile,
# cancelling the run it replaces. Any other label event is a no-op: every
# job skips (they all need `profile`), and it has its own concurrency
# group, so it cancels nothing (opening a pull request with labels fires
# `opened` and `labeled` together).
#
# Documentation-only changes (Markdown, .agents/) skip the workflow.

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", ".agents/**"]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths-ignore: ["**.md", ".agents/**"]
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  workflow_dispatch:

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref }}${{
    (github.event.action == 'labeled' || github.event.action == 'unlabeled')
    && github.event.label.name != 'full-ci'
    && format('-label-{0}', github.event.label.name) || '' }}
  cancel-in-progress: true

env:
  R_VERSION: "4.5.3"

jobs:
  profile:
    if: >-
      (github.event.action != 'labeled' && github.event.action != 'unlabeled')
      || github.event.label.name == 'full-ci'
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.pick.outputs.full }}
    steps:
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          FULL_CI_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          case "$EVENT" in
            schedule|workflow_dispatch) full=true ;;
            pull_request) full="$FULL_CI_LABEL" ;;
            *) full=false ;;
          esac
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "Profile: $([ "$full" = true ] && echo full || echo quick)" \
            >> "$GITHUB_STEP_SUMMARY"

  # Quick profile.

  lint:
    needs: profile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --only-group dev ruff check .
      - run: uv run --only-group dev ruff format --check .

  unit:
    needs: profile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build-free tests
        run: uv run pytest -v -p no:randomly tests/test_unit.py

  build:
    needs: profile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run scripts/build.py --r-version "$R_VERSION" --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-64
          path: dist/*.whl
          retention-days: 7

  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "debian:12", "rockylinux:8"]
    container: ${{ matrix.image }}
    steps:
      # which: base R calls /usr/bin/which (design §12).
      # gcc, make: building source packages. strace: the relocation test.
      - name: System requirements
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update
            apt-get install -y --no-install-recommends \
              ca-certificates curl gcc libc6-dev make strace
          else
            dnf install -y which gcc make strace tar gzip
          fi
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          name: wheel-linux-64
          path: dist
      - name: Install zur as a uv tool
        run: |
          uv tool install dist/zur-*.whl
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"
      - name: Tests against the installed tool
        env:
          ZUR_R_VERSION: ${{ env.R_VERSION }}
        run: uv run pytest -v tests/test_installed.py

  # Full profile. Every job here has `needs: profile` and
  # `if: needs.profile.outputs.full == 'true'`. The host compiler matrix
  # (stage 10) and the other platforms' legs (stages 20 to 23) join here;
  # until then this placeholder shows the gate opening.

  full:
    needs: profile
    if: needs.profile.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Full profile; no extra legs yet (roadmap stage 2)."
