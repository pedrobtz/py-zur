name: build

# Two profiles (roadmap, "CI profiles"):
#
# - quick: every pull request and every push to main. Jobs with no
#   profile condition are quick.
# - full: quick plus every job gated on `needs.profile.outputs.full`.
#   It runs when the pull request has the `full-ci` label, on the weekly
#   schedule and on dispatch.
#
# Label events do not trigger runs: a run on a label change would replace
# the checks of the run before it (the latest check of a name wins), and
# skipping it would show a red run as skipped. The `profile` job reads
# the pull request's labels when it runs instead, so after adding or
# removing `full-ci`, push or re-run the workflow
# (`gh run rerun <run-id>`) to switch profile.
#
# Documentation-only changes (Markdown, .agents/) skip the workflow.
#
# The dispatch input `pango` is the one-off measurement of what D14 saves
# (roadmap stage 9): the build installs pango-devel (ZUR_MEASURE_PANGO=1),
# its prefix test only confirms pango is in use, its wheel is uploaded as
# wheel-linux-x86_64-pango, and no job tests it.

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", ".agents/**"]
  pull_request:
    paths-ignore: ["**.md", ".agents/**"]
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  workflow_dispatch:
    inputs:
      pango:
        description: "Measurement only: build with pango-devel (D14), test nothing"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      full: ${{ steps.pick.outputs.full }}
    steps:
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          case "$EVENT" in
            schedule|workflow_dispatch) full=true ;;
            pull_request)
              labels=$(gh pr view "$PR" --json labels --jq '.labels[].name')
              if printf '%s\n' "$labels" | grep -qx full-ci; then
                full=true
              else
                full=false
              fi
              ;;
            *) full=false ;;
          esac
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "Profile: $([ "$full" = true ] && echo full || echo quick)" \
            | tee -a "$GITHUB_STEP_SUMMARY"

  # Quick profile.

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --only-group dev ruff check .
      - run: uv run --only-group dev ruff format --check .

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build-free tests
        run: uv run pytest -v tests/test_unit.py

  # The Linux x86_64 wheel (roadmap stages 3 to 5, design §6). R 4.6.2 is
  # built from source in the manylinux_2_28 image pinned by digest in
  # scripts/linux/image; every library comes from manifests/linux.toml,
  # either a dnf package at its pinned version or built from a source
  # tarball checked by SHA-256. The built ones live in /opt/zur-deps,
  # cached under the manifest's hash and the image digest. R is installed
  # into /opt/zur inside the container, tests/test_prefix.py runs there,
  # and scripts/build.py repairs a copy of it into the wheel.
  build-linux-x86_64:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash # -eo pipefail, so a failure before `| tee` fails the step
    env:
      ZUR_PREFIX: /opt/zur
      ZUR_DEPS: /opt/zur-deps
      ZUR_MEASURE_PANGO: ${{ inputs.pango && '1' || '' }}
      WHEEL_ARTIFACT: wheel-linux-x86_64${{ inputs.pango && '-pango' || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Start the build container
        id: image
        run: |
          image=$(grep -v '^#' scripts/linux/image)
          echo "Image: $image" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "digest=${image##*@}" >> "$GITHUB_OUTPUT"
          # Created before the mount, so it belongs to the runner's user
          # and the cache can restore into it.
          mkdir -p "$RUNNER_TEMP/zur-deps"
          docker run -d --name zur -e ZUR_PREFIX -e ZUR_DEPS -e ZUR_MEASURE_PANGO \
            -v "$GITHUB_WORKSPACE:/io" -v "$RUNNER_TEMP/zur-deps:$ZUR_DEPS" \
            -w /io "$image" sleep infinity
          docker exec zur bash -c 'command -v uv || pipx install uv'
      - name: Install the pinned image packages
        run: docker exec zur uv run --frozen scripts/linux/build-r.sh deps
      - name: Restore the built dependencies
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/zur-deps
          # build-deps.sh holds the recipes, so it is part of the key too.
          key: >-
            deps-linux-x86_64-${{ hashFiles('manifests/linux.toml',
            'scripts/linux/build-deps.sh') }}-${{ steps.image.outputs.digest
            }}${{ inputs.pango && '-pango' || '' }}
      - name: Build the dependencies from source
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          docker exec zur uv run --frozen scripts/linux/build-deps.sh 2>&1 \
            | tee build-deps.log
          grep '^Dependency build time' build-deps.log | tee -a "$GITHUB_STEP_SUMMARY"
          # Written by root in the container, saved by the runner's user.
          docker exec zur chmod -R a+rX "$ZUR_DEPS"
      - name: Fetch and verify the R tarball
        run: docker exec zur uv run --frozen scripts/linux/build-r.sh source
      - name: Build R
        run: |
          docker exec zur scripts/linux/build-r.sh build 2>&1 | tee build-r.log
          grep '^R build time' build-r.log | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Write BUILD-INFO.json
        run: |
          docker exec zur uv run --frozen scripts/deps.py build-info \
            "$ZUR_PREFIX/BUILD-INFO.json"
          docker exec zur cat "$ZUR_PREFIX/BUILD-INFO.json"
      - name: DT_NEEDED of every ELF file in the prefix
        run: docker exec zur uv run --frozen scripts/elf_needed.py "$ZUR_PREFIX"
      - name: Tests against the prefix
        if: ${{ !inputs.pango }}
        run: docker exec zur uv run --frozen pytest -v tests/test_prefix.py
      - name: The measurement build uses pango
        if: ${{ inputs.pango }}
        run: >-
          docker exec zur uv run --frozen pytest -v tests/test_prefix.py
          -k measurement_build_has_pango
      # Fails when the wheel is over PyPI's per-file limit, the default of
      # --max-size (design §10).
      - name: Repair and pack the wheel
        run: |
          docker exec zur uv run --frozen scripts/build.py \
            --prefix "$ZUR_PREFIX" --deps "$ZUR_DEPS" --out dist \
            --size-report 2>&1 | tee build-wheel.log
          wheel=$(ls dist/*.whl)
          echo "Wheel ($WHEEL_ARTIFACT): $(basename "$wheel"), $(stat -c %s "$wheel") bytes" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          { echo '```'; sed -n '/^prune:/p; /^size report:/,$p' build-wheel.log; echo '```'; } \
            >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.WHEEL_ARTIFACT }}
          path: dist/*.whl
          retention-days: 7

  # Build checks against the wheel file (tests/test_build.py). A job of its
  # own, so the installed-tool tests run even when one of these fails.
  check-linux-x86_64:
    needs: build-linux-x86_64
    if: ${{ !inputs.pango }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          name: wheel-linux-x86_64
          path: dist
      - name: Build checks
        run: ZUR_WHEEL=$(ls dist/*.whl) uv run pytest -v tests/test_build.py

  # The installed tool in each container (roadmap "CI profiles"), the two
  # minimal images (stage 6) included: debian:12-slim has no fonts and no
  # CA bundle (its tzdata is removed below); rockylinux:8-minimal has no
  # which. They get
  # only what the workflow itself needs, so the tests needing a compiler or
  # strace skip there and run in the other three.
  test-linux-x86_64:
    needs: build-linux-x86_64
    if: ${{ !inputs.pango }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - "ubuntu:24.04"
          - "debian:12"
          - "rockylinux:8"
          - "debian:12-slim"
          - "rockylinux:8-minimal"
    container: ${{ matrix.image }}
    env:
      ZUR_CONTAINER: ${{ matrix.image }}
    steps:
      # ca-certificates: the system bundle bin/R points at (design §6.4).
      # gcc, make: building source packages. strace: the relocation test.
      # tar, gzip: the checkout and setup-uv actions unpack with them.
      # No which (design §6.4): R must not need it.
      - name: System requirements
        run: |
          case "$ZUR_CONTAINER" in
            # ca-certificates after the no-bundle check. Bookworm's slim
            # image has tzdata; it is removed, so the time-zone checks run
            # on R's own zoneinfo alone (roadmap stage 6).
            debian:12-slim) rm -rf /usr/share/zoneinfo /etc/localtime ;;
            rockylinux:8-minimal) microdnf install -y tar gzip ;;
            *)
              if command -v apt-get >/dev/null; then
                apt-get update
                apt-get install -y --no-install-recommends \
                  ca-certificates curl gcc libc6-dev make strace
              else
                dnf install -y ca-certificates gcc make strace tar gzip
              fi
              ;;
          esac
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          name: wheel-linux-x86_64
          path: dist
      - name: Install zur as a uv tool
        run: |
          uv tool install dist/zur-*.whl
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"
      # Roadmap stage 6: without any CA bundle R still starts and bin/R
      # sets no CA variable; then the bundle HTTPS needs is installed.
      - name: Tests without a CA bundle
        if: matrix.image == 'debian:12-slim'
        env:
          ZUR_EXPECT_NO_CA_BUNDLE: "1"
        run: uv run pytest -v tests/test_installed.py -k no_ca_bundle
      - name: Install a CA bundle
        if: matrix.image == 'debian:12-slim'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates
      # ZUR_WHEEL: the reinstall check of the user library (stage 7).
      - name: Tests against the installed tool
        run: |
          ZUR_WHEEL="$(ls "$PWD"/dist/zur-*.whl)" \
            uv run pytest -v tests/test_installed.py

  # One home directory used by Ubuntu 24.04 and Rocky Linux 8 containers in
  # turn, and a read-only home (roadmap stage 7). The tests start the
  # containers themselves with docker run, R from the unpacked wheel.
  home-linux-x86_64:
    needs: build-linux-x86_64
    if: ${{ !inputs.pango }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          name: wheel-linux-x86_64
          path: dist
      - name: Shared and read-only home
        run: |
          ZUR_DOCKER=1 ZUR_WHEEL="$(ls "$PWD"/dist/zur-*.whl)" \
            uv run pytest -v tests/test_installed.py -k "shared_home or read_only_home"

  # The pak recipe of design §6.6 and P3M binary packages (roadmap stage
  # 8), in containers with no compiler. The host runtimes binary packages
  # assume (design §6.5) are installed here, since zur doctor comes later.
  # The binary set and the system-requirements check run on Ubuntu only.
  pak-linux-x86_64:
    needs: build-linux-x86_64
    if: ${{ !inputs.pango }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "debian:13", "rockylinux:8"]
    container: ${{ matrix.image }}
    env:
      ZUR_CONTAINER: ${{ matrix.image }}
    steps:
      - name: Host runtimes for binary packages
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update
            apt-get install -y --no-install-recommends \
              ca-certificates libgomp1 libgfortran5
          else
            dnf install -y libgomp libgfortran tar gzip
          fi
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          name: wheel-linux-x86_64
          path: dist
      - name: Install zur as a uv tool
        run: |
          uv tool install dist/zur-*.whl
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"
      - name: pak recipe and binary packages
        # Also R's start, CA bundle, HTTPS and user library, since
        # debian:13 is in no other job.
        run: |
          k="pak or r_version or ca_bundle_is_the_system_one"
          k="$k or https_download or user_library_is_zurs_own"
          ZUR_PAK=1 uv run pytest -v tests/test_installed.py -k "$k"

  # zur doctor (roadmap stage 11, design §6.5, §13) and the RHEL 9 BLAS
  # shim (D16), one container per starting state. ZUR_DOCTOR tells the
  # tests what the container holds at each step; the package manager is
  # their oracle. The bare images first ("missing"), then the line
  # `zur doctor --command` prints is run, and they hold the runtimes and
  # no compiler ("runtimes"): debian:13-slim then installs data.table with
  # the §6.6 recipe (P3M's bookworm index has none, §18.2); rockylinux:9
  # loads its RcppArmadillo, which links libflexiblas.so.3, without and
  # then with the host's flexiblas. debian:12-slim stops after "missing".
  doctor-linux-x86_64:
    needs: build-linux-x86_64
    if: ${{ !inputs.pango }}
    runs-on: ubuntu-latest
    name: doctor-linux-x86_64 (${{ matrix.case }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { case: debian-12-slim, image: "debian:12-slim", start: missing }
          - { case: debian-13-slim, image: "debian:13-slim", start: missing }
          - { case: rockylinux-8, image: "rockylinux:8", start: missing }
          - { case: rockylinux-9, image: "rockylinux:9", start: missing }
          - { case: ubuntu-24.04-runtimes, image: "ubuntu:24.04", start: runtimes }
          - { case: ubuntu-24.04-full, image: "ubuntu:24.04", start: full }
    # rockylinux:9's image declares no PATH, so the runner's PATH would be
    # only what the actions add (no sh).
    container:
      image: ${{ matrix.image }}
      env:
        PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    env:
      ZUR_CONTAINER: ${{ matrix.image }}
      CASE: ${{ matrix.case }}
    steps:
      # tar, gzip: the checkout and setup-uv actions unpack with them.
      - name: Starting state
        run: |
          case "$CASE" in
            rockylinux-*) dnf install -y tar gzip ;;
            ubuntu-24.04-runtimes)
              apt-get update
              apt-get install -y --no-install-recommends libgomp1 libgfortran5
              ;;
            ubuntu-24.04-full)
              apt-get update
              apt-get install -y --no-install-recommends build-essential gfortran
              ;;
          esac
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          name: wheel-linux-x86_64
          path: dist
      - name: Install zur as a uv tool
        run: |
          uv tool install dist/zur-*.whl
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"
      - name: zur doctor (${{ matrix.start }})
        run: |
          zur doctor || true
          ZUR_DOCTOR=${{ matrix.start }} uv run pytest -v tests/test_installed.py -k doctor
      - name: Run the line zur doctor --command prints
        if: matrix.start == 'missing' && matrix.case != 'debian-12-slim'
        run: |
          zur doctor --command | tee -a "$GITHUB_STEP_SUMMARY"
          eval "$(zur doctor --command)"
          zur doctor
      # The CA bundle HTTPS needs (roadmap stage 6 note).
      - name: CA bundle
        if: matrix.case == 'debian-13-slim'
        run: apt-get install -y --no-install-recommends ca-certificates
      - name: zur doctor after the line, and the pak recipe
        if: matrix.case == 'debian-13-slim' || matrix.case == 'rockylinux-8'
        run: |
          k="doctor"
          [ "$CASE" = debian-13-slim ] && k="$k or pak_recipe_installs"
          ZUR_DOCTOR=runtimes ZUR_PAK=1 uv run pytest -v tests/test_installed.py -k "$k"
      - name: zur doctor after the line, and the BLAS shim without flexiblas
        if: matrix.case == 'rockylinux-9'
        run: |
          k="doctor or pak_recipe_installs or flexiblas"
          ZUR_DOCTOR=runtimes ZUR_PAK=1 ZUR_FLEXIBLAS=absent \
            uv run pytest -v tests/test_installed.py -k "$k"
      - name: The BLAS shim with the host's flexiblas
        if: matrix.case == 'rockylinux-9'
        run: |
          dnf install -y flexiblas
          ZUR_PAK=1 ZUR_FLEXIBLAS=present uv run pytest -v tests/test_installed.py -k flexiblas

  # Full profile. Every job here has `needs: profile` and
  # `if: needs.profile.outputs.full == 'true'`. The other platforms' legs
  # (stages 20 to 23) join here.

  # Source packages across host compilers (roadmap stage 10, design §13):
  # the fixture packages of tests/fixtures with each host's own gcc, g++,
  # gfortran and make, from the oldest supported (gcc 8, Rocky Linux 8)
  # to the newest in a current distribution (the newest Fedora release,
  # pinned by tag). ZUR_COMPILERS=1 makes a missing compiler a failure
  # and runs the MASS check (network) on Ubuntu 24.04. To add a leg: an
  # image in the matrix, and its package manager's compiler packages in
  # the first step.
  compilers-linux-x86_64:
    needs: [profile, build-linux-x86_64]
    if: needs.profile.outputs.full == 'true' && !inputs.pango
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["rockylinux:8", "ubuntu:24.04", "fedora:45"]
    container: ${{ matrix.image }}
    env:
      ZUR_CONTAINER: ${{ matrix.image }}
      ZUR_COMPILERS: "1"
    steps:
      - name: Host compilers
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update
            apt-get install -y --no-install-recommends \
              ca-certificates gcc g++ gfortran libc6-dev make
          else
            dnf install -y gcc gcc-c++ gcc-gfortran make tar gzip
          fi
          echo "$ZUR_CONTAINER: $(g++ --version | head -n 1)" \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          name: wheel-linux-x86_64
          path: dist
      - name: Install zur as a uv tool
        run: |
          uv tool install dist/zur-*.whl
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"
      - name: Source packages
        run: |
          R CMD config CXX
          k="source_package or r_cmd_config_cxx or r_cmd_shlib"
          k="$k or makeconf or recommended_package"
          uv run pytest -v -rs tests/test_installed.py -k "$k"
