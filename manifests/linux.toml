# Every library the Linux wheel bundles (design §6.1, §11, §14), for the
# manylinux_2_28 image named in scripts/linux/image. Read by
# scripts/deps.py; the CI cache of the libraries built from source is
# keyed on this file's hash and the image digest (roadmap stage 4).
#
# Each [[dependency]] has:
#   name, version   upstream name and version, as R reports it
#   origin          "image": an AlmaLinux 8 package, installed by dnf at
#                   exactly `package_version` ([epoch:]version-release);
#                   "source": built in the image from `url`, checked
#                   against `sha256` before anything is unpacked
#   license         SPDX expression of the licence files below, as read
#                   in them (stage 13); `LicenseRef-public-domain` where a
#                   file puts a part in the public domain
#   license_files   the files shipped in the wheel under
#                   licenses/<name>/: for "source", paths in the unpacked
#                   tarball (build-deps.sh keeps them); for "image", paths
#                   in the image, owned by a package built from `srpm`, or
#                   `srpm:<archive>/<path>` for a file only the source RPM
#                   has. At least one.
#   sonames         the shared libraries it provides that R's files or
#                   another entry link; every file the repair grafts
#                   belongs to exactly one entry (scripts/build.py)
#   why             for "image": why that version is adequate; for
#                   "source": why it is not taken from the image
# and, for "image" entries only:
#   srpm            the AlmaLinux 8 source RPM the package is built from:
#                   `nvr` (name-version-release; rpm-check refuses an
#                   installed package built from another), `url` and
#                   `sha256` (from the repository's metadata); stage 14
#                   mirrors it. An entry whose source cannot be identified
#                   has `source_unknown = { reason, looked_in }` instead
#                   (design §14); none does yet.
#   via             (optional) the entry, or "r", whose files link this
#                   library: the libraries no configure option asks for
#
# Decided 2026-11-24 (stage 4). libcurl and OpenSSL are built: they face
# the network, and §16 question 2 tracks them for rebuilds. Every other
# library comes from the image: R needs no newer version than AlmaLinux 8
# ships (R-admin's minimums are quoted), and R uses each on local data.
# Versions are the newest in AlmaLinux 8's repositories on 2026-11-24.
#
# Decided 2026-11-24 (stage 6): fontconfig is built too (design §6.1),
# and the font family the wheel ships (design §6.4) is pinned here, as an
# "image" entry with no sonames.
#
# Decided 2026-11-24 (stage 13): the libraries the repair grafts that no
# configure option names (cairo's X11 and pixman, readline's libtinfo,
# the Fortran runtime, ...) are entries too, with `via`. Source RPMs are
# in https://vault.almalinux.org/8.10/, the archive of AlmaLinux 8.10,
# the last minor release; their SHA-256 are from its
# repodata on 2026-11-24.

# --- Built from source -----------------------------------------------------

[[dependency]]
name = "openssl"
version = "3.5.9"
origin = "source"
url = "https://github.com/openssl/openssl/releases/download/openssl-3.5.9/openssl-3.5.9.tar.gz"
sha256 = "603f5602e2eef00d77fbd429d34dcd5822bb301757a1bc9cdb24c670f1eb859a"
license = "Apache-2.0"
license_files = ["LICENSE.txt"]
sonames = ["libssl.so.3", "libcrypto.so.3"]
why = "The image's 1.1.1k is past upstream end of life; 3.5 is the current LTS series (supported to 2030), so rebuilds take patch releases only."

[[dependency]]
name = "curl"
version = "8.23.0"
origin = "source"
url = "https://curl.se/download/curl-8.23.0.tar.xz"
sha256 = "8dadd7d2536a314f982ad05a651b713f426bf7d02cc2c76cffb9796f2218e6c5"
license = "curl"
license_files = ["COPYING"]
sonames = ["libcurl.so.4"]
why = "The image's 7.61.1 is from 2018 and links the image's OpenSSL 1.1.1; R's download.file() and url() go through it."

